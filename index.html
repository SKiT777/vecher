<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Вечер вопросов</title>
<style>
  :root {
    --bg: #14111a; --card: #1f1a28; --text: #f2eef7; --muted: #9a90a8;
    --a: #5b8cff; --b: #ff4f7b; --ok: #3ecf8e; --line: #2e2739;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding: 16px;
    display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 28px; margin: 8px 0 0; }
  h2 { font-size: 21px; margin: 0; }
  .muted { color: var(--muted); font-size: 15px; }
  button { font: inherit; border-radius: 14px; padding: 14px 16px; cursor: pointer;
    background: var(--card); color: var(--text); border: 1px solid var(--line); }
  button.primary { background: var(--text); color: var(--bg); font-weight: 600; border: 0; }
  button.big { width: 100%; padding: 18px; font-size: 19px; }
  button.link { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px; }
  button:disabled { opacity: .35; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .spacer { flex: 1; }

  .card { background: var(--card); border-radius: 22px; padding: 22px 20px; display: grid; gap: 16px;
    border-top: 5px solid var(--a); touch-action: pan-y; transition: transform .2s, opacity .2s; }
  .tag { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 99px;
    background: #ffffff14; color: var(--muted); margin-right: 6px; }
  .qtext { font-size: 24px; line-height: 1.35; font-weight: 500; }
  .format { font-size: 15px; color: var(--a); }

  .prompts { display: grid; gap: 10px; }
  .prompt { padding: 12px 14px; border-radius: 14px; background: #ffffff0a; font-size: 18px;
    animation: in .25s ease-out; }
  .prompt.deep { background: #ff4f7b1f; border: 1px solid #ff4f7b66; }
  .prompt .muted { display: block; font-size: 13px; margin-bottom: 2px; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }

  .clock { display: flex; align-items: center; gap: 10px; }
  .clock .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; min-width: 44px; }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--ok); transition: width 1s linear; }
  .bar.over > div { background: var(--b); }

  .choice { display: grid; gap: 10px; }
  .fb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fb button { padding: 16px 4px; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Колода по умолчанию. Готовится на ПК в decks/*.json и вставляется сюда. -->
<script type="application/json" id="defaultDeck">

   "question": "Какое путешествие ты вспоминаешь чаще всего? Не обязательно лучшее — именно то, что чаще всплывает в памяти.",

   "question": "Какое блюдо для тебя пахнет домом? Кто его готовил и когда?",
   "prompts": [

   "format": "Каждый рассказывает по очереди",
   "question": "Чем ты когда-то увлекался(ась) так сильно, что тратил(а) на это всё свободное время?",

  },
  {

   ],
   "format": "Каждый рассказывает по очереди",
   "question": "Какой фильм, книга или сериал тебя по-настоящему зацепил — так, что думал(а) о нём ещё несколько дней?",
   "prompts": [
    "Что ты можешь пересматривать бесконечно?",
    "Что ты всем советуешь, но никто так и не посмотрел?",

  {

   ],

  },
  {

   "tags": [

   ],
   "format": "Каждый рассказывает по очереди",
   "question": "Какие традиции были в твоей семье: праздники, привычки, странные ритуалы?",
   "prompts": [
    "Как у вас отмечали Новый год?",
    "Что из этого вы переняли в свою пару, а от чего отказались?",
    "Какая традиция у вас появилась уже вдвоём?"
   ],
   "deeper": "Какую традицию мы могли бы завести вчетвером?"
  }
 ]

<script>
const SOFT_LIMIT = 10 * 60;   // мягкий лимит на тему, секунд
const RARE_AFTER = 3;         // после 3 «скучно» по тегу такие темы почти не выпадают

const $app = document.getElementById("app");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const deck = JSON.parse(document.getElementById("defaultDeck").textContent);
let S = null;         // вечер: { startedAt, topics: [...] }
let timerId = null;

function render(html) { clearInterval(timerId); $app.innerHTML = html; }

/* ---------- История между вечерами ---------- */
// played: id сыгранных тем; boring: { тег: сколько раз скучно }
const hist = () => store.get("history", { played: [], boring: {} });
const saveHist = h => store.set("history", h);

function weight(t, h) {
  const boring = Math.max(0, ...t.tags.map(g => h.boring[g] || 0));
  return boring >= RARE_AFTER ? 0.1 : 1 / (1 + boring * 0.5);
}

// случайная тема с учётом весов; сыгранные и уже показанные сегодня — не повторяем
function pickTopic() {
  const h = hist();
  const seenToday = new Set(S.topics.map(x => x.id));
  const pool = deck.topics.filter(t => !h.played.includes(t.id) && !seenToday.has(t.id));
  if (!pool.length) return null;
  const ws = pool.map(t => weight(t, h));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  return pool.find((t, i) => (r -= ws[i]) <= 0) || pool[pool.length - 1];
}

/* ---------- Экраны ---------- */
function screenHome() {
  const h = hist();
  const left = deck.topics.filter(t => !h.played.includes(t.id)).length;
  render(`
    <div class="spacer"></div>
    <h1>Вечер вопросов</h1>
    <div class="muted">Одна тема — один разговор минут на 5–10. Не зашла — смахните влево.</div>
    <div class="muted">Новых тем в колоде: ${left} из ${deck.topics.length}</div>
    <div class="spacer"></div>
    <button class="primary big" id="go" ${left ? "" : "disabled"}>Начать</button>
    ${h.played.length ? `<button class="link" id="reset">Сбросить историю сыгранных тем</button>` : ""}
  `);
  document.getElementById("go").onclick = () => {
    S = { startedAt: new Date().toISOString(), deckId: deck.id, topics: [] };
    screenTopic();
  };
  document.getElementById("reset")?.addEventListener("click", () => {
    if (confirm("Все темы снова станут новыми. Сбросить?")) { saveHist({ played: [], boring: {} }); screenHome(); }
  });
}

function screenTopic() {
  const t = pickTopic();
  if (!t) return screenEnd("Новые темы в колоде закончились.");
  const rec = { id: t.id, question: t.question, shownAt: new Date().toISOString(), promptsOpened: 0, deeper: false };
  S.topics.push(rec);
  store.set("currentEvening", S);
  const start = Date.now();

  render(`
    <div class="clock"><span class="t" id="t">0:00</span><div class="bar" id="bar"><div></div></div></div>
    <div class="card" id="card">
      <div>${t.tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      <div class="format">${esc(t.format || "")}</div>
      <div class="qtext">${esc(t.question)}</div>
      <div class="prompts" id="prompts"></div>
      <button id="more">Подкинуть вопрос</button>
    </div>
    <div class="hint">Разговор затих — «Подкинуть вопрос». Тема не заходит — смахните карточку влево.</div>
    <div class="spacer"></div>
    <div class="row">
      <button id="skip">← Другая тема</button>
      <button class="primary" id="done">Обсудили ✓</button>
    </div>
  `);

  // мягкий таймер: полоска на 10 минут, потом краснеет, но ничего не прерывает
  const tick = () => {
    const sec = Math.round((Date.now() - start) / 1000);
    document.getElementById("t").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    document.querySelector("#bar > div").style.width = Math.min(100, sec / SOFT_LIMIT * 100) + "%";
    document.getElementById("bar").classList.toggle("over", sec >= SOFT_LIMIT);
  };
  tick(); timerId = setInterval(tick, 1000);

  // подсказки по одной, последней — вопрос поглубже
  const $more = document.getElementById("more");
  $more.onclick = () => {
    const box = document.getElementById("prompts");
    if (rec.promptsOpened < t.prompts.length) {
      box.insertAdjacentHTML("beforeend", `<div class="prompt">${esc(t.prompts[rec.promptsOpened])}</div>`);
      rec.promptsOpened++;
      if (rec.promptsOpened === t.prompts.length && t.deeper) $more.textContent = "Поглубже";
    } else if (t.deeper && !rec.deeper) {
      box.insertAdjacentHTML("beforeend", `<div class="prompt deep"><span class="muted">поглубже</span>${esc(t.deeper)}</div>`);
      rec.deeper = true;
    }
    if (rec.promptsOpened >= t.prompts.length && (rec.deeper || !t.deeper)) $more.remove();
    store.set("currentEvening", S);
  };

  const finish = () => { rec.seconds = Math.round((Date.now() - start) / 1000); };
  document.getElementById("skip").onclick = () => { finish(); screenSkip(t, rec); };
  document.getElementById("done").onclick = () => { finish(); screenRate(t, rec); };
  swipe(document.getElementById("card"), () => { finish(); screenSkip(t, rec); });
}

// смахивание карточки влево
function swipe(el, onLeft) {
  let x0 = null, dx = 0;
  el.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; x0 = e.clientX; dx = 0; el.style.transition = "none"; });
  el.addEventListener("pointermove", e => {
    if (x0 === null) return;
    dx = Math.min(0, e.clientX - x0);
    el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    el.style.opacity = 1 + dx / 400;
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null; el.style.transition = "";
    if (dx < -90) { el.style.transform = "translateX(-120%) rotate(-12deg)"; el.style.opacity = 0; setTimeout(onLeft, 180); }
    else { el.style.transform = ""; el.style.opacity = ""; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("pointerleave", end);
}

function screenSkip(t, rec) {
  render(`
    <div class="spacer"></div>
    <h2>Почему мимо?</h2>
    <div class="muted">${esc(t.question)}</div>
    <div class="choice">
      <button class="big" data-r="boring">😐 Скучная тема</button>
      <button class="big" data-r="not_now">🕓 Не сегодня</button>
    </div>
    <div class="hint">«Скучная» — похожие темы будут выпадать реже. «Не сегодня» — тема вернётся в другой раз.</div>
    <div class="spacer"></div>
  `);
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    rec.result = "skip"; rec.reason = b.dataset.r;
    if (b.dataset.r === "boring") {
      const h = hist();
      t.tags.forEach(g => h.boring[g] = (h.boring[g] || 0) + 1);
      h.played.push(t.id);
      saveHist(h);
    }
    store.set("currentEvening", S);
    screenTopic();
  });
}

function screenRate(t, rec) {
  render(`
    <div class="spacer"></div>
    <h2>Как зашла тема?</h2>
    <div class="muted">${esc(t.question)}</div>
    <div class="fb">
      <button data-r="fire">🔥<br>Огонь</button>
      <button data-r="ok">👍<br>Норм</button>
      <button data-r="meh">😐<br>Так себе</button>
    </div>
    <div class="spacer"></div>
  `);
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    rec.result = "done"; rec.rating = b.dataset.r;
    const h = hist();
    h.played.push(t.id);
    if (b.dataset.r === "meh") t.tags.forEach(g => h.boring[g] = (h.boring[g] || 0) + 1);
    saveHist(h);
    store.set("currentEvening", S);
    screenNext();
  });
}

function screenNext() {
  const done = S.topics.filter(x => x.result === "done").length;
  render(`
    <div class="spacer"></div>
    <h2>Обсудили тем: ${done}</h2>
    <div class="muted">Ещё одну или хватит на сегодня?</div>
    <div class="spacer"></div>
    <button class="primary big" id="more">Ещё тема</button>
    <button class="big" id="end">Хватит на сегодня</button>
  `);
  document.getElementById("more").onclick = screenTopic;
  document.getElementById("end").onclick = () => screenEnd();
}

function screenEnd(note = "") {
  S.endedAt = new Date().toISOString();
  store.set("currentEvening", S);
  const done = S.topics.filter(x => x.result === "done");
  const mins = Math.round(done.reduce((a, x) => a + (x.seconds || 0), 0) / 60);
  render(`
    <div class="spacer"></div>
    <h1>Вечер сыгран</h1>
    ${note ? `<div class="muted">${note}</div>` : ""}
    <div class="muted">Тем обсудили: ${done.length}, примерно ${mins} мин.</div>
    ${done.map(x => `<div class="prompt">${esc(x.question)}</div>`).join("")}
    <div class="spacer"></div>
    <button class="big" id="exp">Сохранить итоги (для ПК)</button>
    <button class="primary big" id="home">Готово</button>
  `);
  document.getElementById("exp").onclick = exportEvening;
  document.getElementById("home").onclick = screenHome;
}

async function exportEvening() {
  const name = `evening_${S.startedAt.slice(0, 16).replace("T", "_").replace(":", "-")}.json`;
  const blob = new Blob([JSON.stringify({ ...S, history: hist() }, null, 2)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
screenHome();
</script>
</body>
</html>
