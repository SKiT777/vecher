<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Вечер вопросов</title>
<style>
  :root {
    --bg: #14111a; --card: #1f1a28; --text: #f2eef7; --muted: #9a90a8;
    --a: #5b8cff; --b: #ff4f7b; --ok: #3ecf8e; --line: #2e2739;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding: 16px;
    display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 26px; margin: 8px 0 0; }
  h2 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); font-size: 15px; }
  input, textarea { width: 100%; padding: 12px 14px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 14px; padding: 14px 16px; cursor: pointer;
    background: var(--card); color: var(--text); border: 1px solid var(--line); }
  button.primary { background: var(--text); color: var(--bg); font-weight: 600; border: 0; }
  button.big { width: 100%; padding: 18px; font-size: 19px; }
  button:disabled { opacity: .35; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .pair { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; }
  .card { background: var(--card); border-radius: 22px; padding: 22px 20px; display: grid; gap: 14px;
    border-top: 5px solid var(--a); }
  .card.B { border-top-color: var(--b); }
  .tag { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 99px;
    background: #ffffff14; color: var(--muted); margin-right: 6px; }
  .qtext { font-size: 23px; line-height: 1.35; font-weight: 500; }
  .timer { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .timer > div { height: 100%; width: 0; background: var(--ok); transition: width 1s linear, background .3s; }
  .timer.over > div { background: var(--b); }
  .fb { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fb button { padding: 10px 4px; font-size: 15px; }
  .fb button.on { background: var(--text); color: var(--bg); }
  .reveal { font-size: 44px; font-weight: 700; text-align: center; padding: 8px 0; }
  .center { text-align: center; }
  .spacer { flex: 1; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; }
  .names button { flex: 1 1 40%; }
  .names button.on { background: var(--b); border-color: var(--b); }
  input[type=range] { padding: 0; accent-color: var(--b); height: 36px; background: none; border: 0; }
  .hidden-screen { background: #000; border-radius: 22px; padding: 40px 20px; text-align: center; display: grid; gap: 18px; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="deckFile" accept=".json,application/json" hidden>

<script src="admin-key.js"></script>
<script>
const CARD_SECONDS = 75;       // мягкий лимит на карточку: 10 карточек ≈ 10–12 минут
const PASSES_PER_PLAYER = 2;
const MECH = {
  talk: "Обсуждаем",
  scale: "Шкала 1–10",
  guess_partner: "Угадай партнёра",
  point: "Показываем пальцем",
  anon_count: "Анонимно",
};

const $app = document.getElementById("app");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let deck = JSON.parse(document.getElementById("defaultDeck").textContent);
let S = null;        // текущая сессия
let timerId = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const partnerOf = i => i ^ 1;  // пары: 0–1 и 2–3

function log(type, data = {}) {
  S.events.push({ type, ...data });
  store.set("currentSession", S);
}

function render(html) {
  clearInterval(timerId);
  $app.innerHTML = html;
}

/* ---------- Экран 1: игроки ---------- */
function screenSetup() {
  const saved = store.get("players", ["", "", "", ""]);
  render(`
    <h1>Вечер вопросов</h1>
    <div class="muted">Колода: <b>${esc(deck.title)}</b>, карточек: ${deck.cards.length}</div>
    <div class="pair"><div class="muted">Пара 1</div>
      <input id="n0" placeholder="Имя" value="${esc(saved[0])}">
      <input id="n1" placeholder="Имя партнёра" value="${esc(saved[1])}"></div>
    <div class="pair"><div class="muted">Пара 2</div>
      <input id="n2" placeholder="Имя" value="${esc(saved[2])}">
      <input id="n3" placeholder="Имя партнёра" value="${esc(saved[3])}"></div>
    <button id="load">Загрузить другую колоду…</button>
    <div class="spacer"></div>
    <button class="primary big" id="go">Начать</button>
  `);
  document.getElementById("load").onclick = () => document.getElementById("deckFile").click();
  document.getElementById("go").onclick = () => {
    const names = [0, 1, 2, 3].map(i => document.getElementById("n" + i).value.trim() || `Игрок ${i + 1}`);
    store.set("players", names);
    const now = new Date();
    S = {
      id: now.toISOString().slice(0, 16).replace("T", "_").replace(":", "-"),
      startedAt: now.toISOString(), startMs: now.getTime(),
      deckId: deck.id, players: names, pairs: [[0, 1], [2, 3]],
      passes: names.map(() => PASSES_PER_PLAYER),
      queue: deck.cards.slice(), idx: 0, events: [],
    };
    log("session_start", { deck: deck.id });
    screenIntro();
  };
}

document.getElementById("deckFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.cards)) throw new Error("нет поля cards");
    deck = d; screenSetup();
  } catch (err) { alert("Не удалось прочитать колоду: " + err.message); }
};

function screenIntro() {
  render(`
    <h1>Готово</h1>
    <div class="muted">Карточек в игре: ${S.queue.length}. У каждого по ${PASSES_PER_PLAYER} «паса» на вечер.</div>
    <div class="muted">Под каждой карточкой три кнопки: <b>скучно</b>, <b>слишком</b>, <b>огонь</b>. По ним будем подбирать следующие колоды.</div>
    <div class="spacer"></div>
    <button class="primary big" id="go">Первая карточка</button>
  `);
  document.getElementById("go").onclick = screenCard;
}

/* ---------- Общие экраны «передай телефон» ---------- */
function handOver(name, hint, next) {
  render(`
    <div class="spacer"></div>
    <div class="hidden-screen">
      <div class="muted">Передай телефон</div>
      <div class="reveal">${esc(name)}</div>
      <div class="muted">${hint}</div>
      <button class="primary big" id="ok">Это я, показать</button>
    </div>
    <div class="spacer"></div>
  `);
  document.getElementById("ok").onclick = next;
}
function hideThen(next) {
  render(`
    <div class="spacer"></div>
    <div class="hidden-screen"><div class="reveal">✓</div><div class="muted">Скрыто</div>
      <button class="big" id="ok">Дальше</button></div>
    <div class="spacer"></div>
  `);
  document.getElementById("ok").onclick = next;
}

/* ---------- Экран 3: карточка ---------- */
function targetFor(card) {
  // в одном раунде A и B направлены на одного человека; раунды идут по кругу
  return ((card.round ?? S.idx + 1) - 1) % 4;
}
function cardText(card, t) {
  return card.text.replaceAll("{name}", S.players[t]).replaceAll("{partner}", S.players[partnerOf(t)]);
}

function screenCard(relog = true) {
  if (S.idx >= S.queue.length) return screenEnd();
  const c = S.queue[S.idx];
  const t = targetFor(c);
  const text = cardText(c, t);
  if (relog) log("card_shown", { cardId: c.id, round: c.round, stage: c.stage, mechanic: c.mechanic,
    target: c.target === "one" ? S.players[t] : c.target, text });

  render(`
    <div class="row muted" style="align-items:center">
      <span>Раунд ${c.round ?? "–"} · ${c.stage === "B" ? "ставка" : "разогрев"}</span>
      <span style="text-align:right">${S.idx + 1}/${S.queue.length}</span>
    </div>
    <div class="timer" id="timer"><div></div></div>
    <div class="card ${c.stage === "B" ? "B" : ""}">
      <div><span class="tag">${MECH[c.mechanic] ?? c.mechanic}</span>${(c.tags || []).map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>
      <div class="qtext">${esc(text)}</div>
      <div id="mech"></div>
    </div>
    ${FB_HTML}
    <div class="spacer"></div>
    <div class="row">
      <button id="pass">🃏 Пас</button>
      <button class="primary" id="next">Дальше →</button>
    </div>
  `);

  // таймер: зелёный → красный после лимита, но не блокирует
  const start = Date.now(), bar = document.querySelector("#timer > div"), wrap = document.getElementById("timer");
  const tick = () => {
    const p = (Date.now() - start) / 1000 / CARD_SECONDS;
    bar.style.width = Math.min(100, p * 100) + "%";
    wrap.classList.toggle("over", p >= 1);
  };
  tick(); timerId = setInterval(tick, 1000);

  bindFeedback(c);
  document.getElementById("next").onclick = () => {
    log("card_done", { cardId: c.id });
    markPlayed(c.id); S.idx++; screenCard();
  };
  document.getElementById("pass").onclick = () => screenPass(c);

  mechanics[c.mechanic]?.(c, t, document.getElementById("mech"));
}

const FB_HTML = `<div class="fb">
  <button data-fb="boring">😐 скучно</button>
  <button data-fb="too_much">🚫 слишком</button>
  <button data-fb="fire">🔥 огонь</button></div>`;
function bindFeedback(c) {
  const cur = store.get("stats", {}).cardFb?.[c.id];
  $app.querySelectorAll("[data-fb]").forEach(b => {
    if (cur && b.dataset.fb === cur) b.classList.add("on");
    b.onclick = () => {
      const on = !b.classList.contains("on");
      $app.querySelectorAll("[data-fb]").forEach(x => x.classList.remove("on"));
      if (on) b.classList.add("on");
      log("feedback", { cardId: c.id, value: on ? b.dataset.fb : null });
      saveTagStats(c, on ? b.dataset.fb : null);
    };
  });
}

/* ---------- Механики ---------- */
const mechanics = {
  talk() {},

  point(c, t, el) {
    el.innerHTML = `<button class="big" id="cd">Отсчёт 3…2…1</button>`;
    el.querySelector("#cd").onclick = () => {
      let n = 3;
      el.innerHTML = `<div class="reveal" id="n">3</div>`;
      const iv = setInterval(() => {
        n--;
        if (n > 0) { el.querySelector("#n").textContent = n; return; }
        clearInterval(iv);
        el.innerHTML = `<div class="reveal">👉 Показывайте!</div>
          <div class="muted">На кого указали больше всего?</div>
          <div class="names">${S.players.map((p, i) => `<button data-i="${i}">${esc(p)}</button>`).join("")}</div>`;
        el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
          el.querySelectorAll("[data-i]").forEach(x => x.classList.remove("on"));
          b.classList.add("on");
          log("point_result", { cardId: c.id, most: S.players[+b.dataset.i] });
        });
      }, 1000);
    };
  },

  // все четверо втайне ставят число, потом каждый угадывает число партнёра, и открываем всё
  scale(c, t, el) {
    el.innerHTML = `<div class="muted">Каждый втайне ставит своё число, потом угадываем числа партнёров.</div>
      <button class="big" id="s">Начать</button>`;
    el.querySelector("#s").onclick = () => {
      const card = S.queue[S.idx];
      collectSecrets(card, i => `
          <h2>${esc(S.players[i])}, твоё число</h2>
          <div class="muted">${esc(card.text)}</div>
          <div class="reveal" id="v">5</div>
          <input type="range" min="1" max="10" value="5" id="r"
            oninput="document.getElementById('v').textContent=this.value">`,
        () => +document.getElementById("r").value,
        values => {
          render(`
            <div class="card"><div class="qtext">${esc(card.text)}</div>
            <div class="muted">Каждый по очереди называет вслух, какое число поставил(а) его партнёр.</div>
            <button class="primary big" id="rv">Показать все числа</button></div>`);
          document.getElementById("rv").onclick = () => {
            values.forEach((value, i) => log("scale_result", { cardId: card.id, player: S.players[i], value }));
            revealAndContinue(card, `<div class="names">${values.map((v, i) =>
              `<div class="pair center"><div class="muted">${esc(S.players[i])}</div><div class="reveal">${v}</div></div>`).join("")}</div>`);
          };
        });
    };
  },

  // все четверо пишут ответ про себя, потом по очереди партнёр угадывает
  guess_partner(c, t, el) {
    el.innerHTML = `<div class="muted">Каждый втайне пишет свой ответ, потом партнёр угадывает его вслух.</div>
      <button class="big" id="s">Начать</button>`;
    el.querySelector("#s").onclick = () => {
      const card = S.queue[S.idx];
      collectSecrets(card, i => `
          <h2>${esc(S.players[i])}, твой ответ</h2>
          <div class="muted">${esc(card.text)}</div>
          <textarea id="a" placeholder="Коротко"></textarea>`,
        () => document.getElementById("a").value.trim(),
        answers => {
          const show = i => {
            if (i >= 4) return revealAndContinue(card, answers.map((a, k) =>
              `<div class="muted">${esc(S.players[k])}: «${esc(a || "…")}»</div>`).join(""));
            const p = partnerOf(i);
            render(`
              <div class="card"><div class="qtext">${esc(card.text)}</div>
              <div class="muted">${esc(S.players[p])}, что ответил(а) ${esc(S.players[i])}? Угадывай вслух!</div>
              <div id="res"><button class="primary big" id="rv">Показать ответ</button></div></div>`);
            document.getElementById("rv").onclick = () => {
              const res = document.getElementById("res");
              res.innerHTML = `<div class="qtext center">«${esc(answers[i] || "…")}»</div>
                <div class="row"><button id="hit">Угадал(а)</button><button id="miss">Мимо</button></div>`;
              const mark = hit => () => {
                log("guess_result", { cardId: card.id, player: S.players[i], guesser: S.players[p], answer: answers[i], hit });
                show(i + 1);
              };
              res.querySelector("#hit").onclick = mark(true);
              res.querySelector("#miss").onclick = mark(false);
            };
          };
          show(0);
        });
    };
  },

  anon_count(c, t, el) {
    el.innerHTML = `<div class="muted">Телефон идёт по кругу, каждый втайне жмёт «да» или «нет». Покажем только общее число.</div>
      <button class="big" id="s">Начать голосование</button>`;
    el.querySelector("#s").onclick = () => {
      const card = S.queue[S.idx];
      const answers = {};
      const ask = async i => {
        if (i >= 4) {
          const yes = Object.values(answers).filter(Boolean).length;
          // кто как ответил — только в зашифрованном виде, читает админ на ПК (admin/sealed.py)
          const sealed = await seal({ cardId: card.id, text: card.text, answers });
          log("anon_result", { cardId: card.id, yes, of: 4, sealed });
          return revealAndContinue(card, `<div class="reveal">${yes} из 4</div><div class="muted center">сказали «да»</div>`);
        }
        handOver(S.players[i], "Ответь честно: сидящие рядом не увидят твой ответ.", () => {
          render(`
            <div class="card"><div class="qtext">${esc(card.text)}</div></div>
            <div class="row"><button class="big" id="y">Да</button><button class="big" id="n">Нет</button></div>`);
          document.getElementById("y").onclick = () => { answers[S.players[i]] = true; hideThen(() => ask(i + 1)); };
          document.getElementById("n").onclick = () => { answers[S.players[i]] = false; hideThen(() => ask(i + 1)); };
        });
      };
      ask(0);
    };
  },
};

// телефон по кругу: каждый втайне что-то вводит, потом done(массив ответов по игрокам)
function collectSecrets(card, formHtml, read, done) {
  const out = [];
  const ask = i => {
    if (i >= 4) return done(out);
    handOver(S.players[i], "Остальные не смотрят.", () => {
      render(formHtml(i) + `<button class="primary big" id="ok">Спрятать</button>`);
      document.getElementById("ok").onclick = () => { out[i] = read(); hideThen(() => ask(i + 1)); };
    });
  };
  ask(0);
}

// после скрытого ввода возвращаемся к карточке, но уже с ответом
function revealAndContinue(card, html, bind) {
  render(`
    <div class="card ${card.stage === "B" ? "B" : ""}">
      <div class="qtext">${esc(cardText(card, targetFor(card)))}</div>
      <div id="res">${html}</div>
    </div>
    <div class="muted center">Обсудите, если хочется.</div>
    ${FB_HTML}
    <div class="spacer"></div>
    <button class="primary big" id="next">Дальше →</button>`);
  bind?.(document.getElementById("res"));
  bindFeedback(card);
  document.getElementById("next").onclick = () => {
    log("card_done", { cardId: card.id });
    markPlayed(card.id); S.idx++; screenCard();
  };
}

/* ---------- Шифрование для админа: AES-GCM + RSA-OAEP, закрытый ключ только на ПК ---------- */
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function seal(obj) {
  const pub = await crypto.subtle.importKey("spki", b64d(ADMIN_PUBKEY), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
  const aes = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, new TextEncoder().encode(JSON.stringify(obj)));
  const k = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pub, await crypto.subtle.exportKey("raw", aes));
  return { k: b64e(k), iv: b64e(iv), ct: b64e(ct) };
}

/* ---------- Пас ---------- */
function screenPass(card) {
  render(`
    <h2>Кто пасует?</h2>
    <div class="muted">Карточка уйдёт без объяснений.</div>
    <div class="names">${S.players.map((p, i) =>
      `<button data-i="${i}" ${S.passes[i] ? "" : "disabled"}>${esc(p)} · ${S.passes[i]}</button>`).join("")}</div>
    <button id="back">Назад к карточке</button>`);
  $app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    S.passes[i]--;
    log("pass", { cardId: card.id, player: S.players[i] });
    markPlayed(card.id); S.idx++; screenCard();
  });
  document.getElementById("back").onclick = () => screenCard(false);  // не дублируем card_shown
}

/* ---------- Статистика между вечерами ---------- */
function markPlayed(id) {
  const st = store.get("stats", { played: [], tags: {} });
  if (!st.played.includes(id)) st.played.push(id);
  store.set("stats", st);
}
function saveTagStats(card, value) {
  const st = store.get("stats", { played: [], tags: {} });
  st.cardFb = st.cardFb || {};
  st.cardFb[card.id] = value;   // последняя оценка карточки; веса тегов считаются на ПК из логов
  store.set("stats", st);
}

/* ---------- Финал и экспорт ---------- */
function screenEnd() {
  log("session_end");
  S.endedAt = new Date().toISOString();
  store.set("currentSession", S);
  const mins = Math.round((Date.now() - S.startMs) / 60000);
  render(`
    <h1>Вечер сыгран</h1>
    <div class="muted">Длительность: ${mins} мин. Карточек: ${S.queue.length}.</div>
    <div class="muted">Сохраните результаты и перенесите на ПК в папку <b>sessions/</b>. Анонимные ответы в файле зашифрованы.</div>
    <div class="spacer"></div>
    <button class="primary big" id="exp">Сохранить результаты</button>
    <button class="big" id="again">В начало</button>`);
  document.getElementById("exp").onclick = exportLog;
  document.getElementById("again").onclick = screenSetup;
}

async function exportLog() {
  const out = { ...S }; delete out.startMs; delete out.queue;
  out.cardIds = S.queue.map(c => c.id);
  const name = `session_${S.id}.json`;
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
screenSetup();
</script>
